[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "dtoolcore"
description = "Core API for managing (scientific) data"
readme = "README.rst"
license = {text = "MIT"}
authors = [
    {name = "Tjelvar Olsson", email = "tjelvar.olsson@gmail.com"}
]
dynamic = ["version"]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-cov",
    "pytz"
]
lint = [
    "ruff"
]
docs = [
    "sphinx",
    "sphinx_rtd_theme"
]

[project.urls]
Documentation = "https://dtoolcore.readthedocs.io"
Repository = "https://github.com/jic-dtool/dtoolcore"
Changelog = "https://github.com/jic-dtool/dtoolcore/blob/main/CHANGELOG.rst"

[project.entry-points."dtool.storage_brokers"]
DiskStorageBroker = "dtoolcore.storagebroker:DiskStorageBroker"

[tool.hatch.version]
source = "vcs"
raw-options = { version_scheme = "guess-next-dev", local_scheme = "no-local-version" }

[tool.hatch.build.hooks.vcs]
version-file = "dtoolcore/version.py"

[tool.hatch.build.targets.sdist]
exclude = [".github", ".pre-commit-config.yaml", "CLAUDE.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=dtoolcore --cov-report=term-missing"

[tool.ruff]
line-length = 79
extend-exclude = ["dtoolcore/version.py", "docs", "venv*"]

[tool.ruff.lint]
# pycodestyle (E, W), pyflakes (F), isort (I)
select = ["E", "W", "F", "I"]
